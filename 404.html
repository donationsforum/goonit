<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goonit</title>
<script>
  // Send any address GitHub Pages can't find (like /estherolive-20317/) to the homepage,
  // which restores the address and opens that creator's profile.
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
    l.pathname.slice(1).replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
